services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ocean-agent-backend:latest
    env_file:
      - ./server/.env
    environment:
      APP_ENV: production
      CORS_ORIGINS: "http://localhost:${FRONTEND_PORT:-8080},http://127.0.0.1:${FRONTEND_PORT:-8080}"
    ports:
      - "9103:8000"
    volumes:
      - ocean-agent-data:/app/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: ocean-agent-frontend:latest
    environment:
      API_TARGET: http://backend:8000
    ports:
      - "65532:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ocean-agent-data:
    name: ocean-agent-data
